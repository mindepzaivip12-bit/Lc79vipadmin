<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>ADMIN - Quản Lý Key</title>
<style>
  body { background: #090a0f; color: #fff; font-family: sans-serif; padding: 20px; }
  .container { max-width: 900px; margin: auto; background: #13141f; padding: 20px; border-radius: 10px; border: 1px solid #05d9e8; }
  h2 { color: #05d9e8; text-align: center; }
  .form-group { display: flex; gap: 10px; margin-bottom: 20px; }
  input { padding: 10px; border-radius: 5px; border: 1px solid #05d9e8; background: #000; color: #fff; outline: none; }
  button { padding: 10px 15px; background: #ff2a6d; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
  button:hover { opacity: 0.8; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { padding: 10px; border: 1px solid #333; text-align: left; font-size: 13px; }
  th { background: #000; color: #ff2a6d; }
  .status-ok { color: #55ff55; }
  .status-bad { color: #ff5555; }
</style>
</head>
<body>
<div class="container">
  <h2>QUẢN LÝ KEY - ADMIN</h2>
  
  <div class="form-group">
    <input type="password" id="admin-pass" placeholder="Nhập mật khẩu Admin..." style="flex: 1">
  </div>

  <div class="form-group">
    <input type="number" id="key-days" placeholder="Số ngày (9999 = vĩnh viễn)" value="30" style="flex: 1">
    <button onclick="createKey()">TẠO KEY MỚI</button>
    <button onclick="loadKeys()" style="background: #05d9e8; color: #000">TẢI LẠI</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Key</th>
        <th>Thời Hạn</th>
        <th>Ngày Tạo</th>
        <th>Hết Hạn</th>
        <th>IP / Thiết bị</th>
        <th>Trạng Thái</th>
        <th>Hành Động</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <!-- Data render ở đây -->
    </tbody>
  </table>
</div>

<script>
  const API_URL = "https://your-admin-server.onrender.com"; // SỬA LINK NÀY

  async function loadKeys() {
    const pass = document.getElementById('admin-pass').value;
    if(!pass) return alert("Nhập mật khẩu!");
    
    try {
      const res = await fetch(`${API_URL}/api/admin/keys`, {
        headers: { 'Authorization': pass }
      });
      if(res.status === 403) return alert("Sai mật khẩu!");
      
      const keys = await res.json();
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      keys.forEach(k => {
        const isExpired = k.expires_at && Date.now() > k.expires_at;
        const status = !k.activated_at ? '<span style="color:#aaa">Chưa dùng</span>' 
                     : isExpired ? '<span class="status-bad">Hết hạn</span>' 
                     : '<span class="status-ok">Hoạt động</span>';
        
        const device = k.ip ? `${k.ip}<br><small>${k.device.substring(0, 30)}...</small>` : '---';
        const expDate = k.expires_at ? new Date(k.expires_at).toLocaleString("vi-VN") : '---';
        
        tbody.innerHTML += `
          <tr>
            <td><b style="color:#05d9e8">${k.key}</b></td>
            <td>${k.days >= 9999 ? 'Vĩnh viễn' : k.days + ' ngày'}</td>
            <td>${new Date(k.created_at).toLocaleString("vi-VN")}</td>
            <td>${expDate}</td>
            <td>${device}</td>
            <td>${status}</td>
            <td><button onclick="deleteKey('${k.key}')" style="background:#ff3333; padding: 5px 10px">Xóa</button></td>
          </tr>
        `;
      });
    } catch(e) { alert("Lỗi kết nối Server!"); }
  }

  async function createKey() {
    const pass = document.getElementById('admin-pass').value;
    const days = parseInt(document.getElementById('key-days').value);
    if(!pass) return alert("Nhập mật khẩu!");
    if(isNaN(days)) return alert("Nhập số ngày hợp lệ!");

    try {
      const res = await fetch(`${API_URL}/api/admin/create`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pass, days: days })
      });
      const data = await res.json();
      if(data.success) {
        alert("Tạo thành công!\nKey: " + data.key);
        loadKeys();
      } else alert(data.error);
    } catch(e) { alert("Lỗi kết nối Server!"); }
  }

  async function deleteKey(key) {
    if(!confirm("Bạn có chắc muốn xóa key này?")) return;
    const pass = document.getElementById('admin-pass').value;
    try {
      const res = await fetch(`${API_URL}/api/admin/delete`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pass, key: key })
      });
      if(res.ok) loadKeys();
    } catch(e) { alert("Lỗi kết nối Server!"); }
  }
</script>
</body>
</html>
